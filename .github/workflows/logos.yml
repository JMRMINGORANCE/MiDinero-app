name: Logos de comercios

# Descarga los logos de los comercios del catálogo y los guarda en el repositorio (app/src/main/assets/logos),
# así van dentro de la app sin que esta necesite Internet. Se lanza al cambiar la lista de dominios o a mano.
on:
  workflow_dispatch:
  push:
    branches-ignore: [screenshots, main]
    paths:
      - tools/logos/domains.tsv
      - tools/logos/fetch_logos.py
      - .github/workflows/logos.yml

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow cairosvg
      - run: python3 tools/logos/fetch_logos.py
      - name: Guardar logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/logos tools/logos/preview.png tools/logos/report.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Logos de comercios descargados"
          # La rama puede haber avanzado mientras se descargaban
          git checkout -- .   # solo diferencias de saltos de línea
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
